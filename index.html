<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadern de seguiment · Psicomotricitat I4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E3A5F;
    --green:#4A7A3E;
    --teal:#3E7C8C;
    --special:#7C8798;
    --bg:#FFFFFF;
    --ink:#1C2530;
    --ink-soft:#5B6472;
    --line:#E4E8ED;
    --panel:#F6F8FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  h1,h2,h3,h4{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    color:var(--navy);
    margin:0;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 0;
  }
  header.top{
    padding:24px 0 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  header.top h1{font-size:1.4rem;}
  header.top p{margin:6px 0 0;color:var(--ink-soft);font-size:0.92rem;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
  }
  .card h2{font-size:1.05rem;margin-bottom:10px;}

  .thisweek{
    border:2px solid var(--navy);
    background:linear-gradient(180deg,#F2F6FA,#FFFFFF);
  }
  .thisweek .eyebrow{
    color:var(--teal);
    font-size:0.78rem;
    font-weight:600;
    margin-bottom:4px;
  }
  .thisweek .session-title{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:1.25rem;
    color:var(--navy);
    margin:4px 0 6px;
  }
  .thisweek .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-top:8px;
  }
  .thisweek .status-msg{
    font-size:0.95rem;
    color:var(--ink-soft);
  }
  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:0.75rem;
    font-weight:600;
    color:#fff;
  }
  .badge.hmb{background:var(--teal);}
  .badge.teatre{background:var(--green);}
  .badge.cos{background:var(--navy);}
  .badge.esp{background:var(--special);}

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.hmb{background:var(--teal);}
  .dot.teatre{background:var(--green);}
  .dot.cos{background:var(--navy);}
  .dot.esp{background:var(--special);}

  label{font-size:0.85rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px;}
  input[type=date], input[type=text]{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    background:#fff;
    color:var(--ink);
  }
  .field{margin-bottom:12px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .row2 > div{flex:1;min-width:140px;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    border:none;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    background:var(--navy);
    color:#fff;
  }
  button.secondary{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  button:hover{opacity:0.9;}

  .skip-list{margin-top:12px;}
  .skip-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    font-size:0.85rem;
  }
  .skip-item .txt{color:var(--ink);}
  .skip-item .txt small{display:block;color:var(--ink-soft);}
  .skip-item button{
    background:transparent;
    color:#B0432E;
    padding:2px 8px;
    font-size:1rem;
  }
  .empty-note{color:var(--ink-soft);font-size:0.85rem;font-style:italic;}
  .reset-row{margin-top:10px;}

  .trimestre-title{
    font-size:1.05rem;
    margin:26px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--line);
  }

  .session-item{
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
    background:#fff;
  }
  .session-item.passed{opacity:0.5;}
  .session-item.current{
    border:2px solid var(--navy);
    box-shadow:0 2px 10px rgba(30,58,95,0.12);
  }
  .session-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    cursor:pointer;
    user-select:none;
  }
  .session-num{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    color:var(--ink-soft);
    font-size:0.85rem;
    min-width:26px;
  }
  .session-head .titles{flex:1;min-width:0;}
  .session-head .titles h3{
    font-size:0.98rem;
    font-weight:600;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .session-head .date{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .chevron{
    transition:transform 0.2s ease;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .session-item.open .chevron{transform:rotate(90deg);}

  .session-body{
    display:none;
    padding:0 14px 16px;
    border-top:1px solid var(--line);
  }
  .session-item.open .session-body{display:block;}

  .obj-line{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:10px 0 12px;
  }

  .block{
    background:var(--panel);
    border-radius:10px;
    padding:12px 14px;
    margin-top:10px;
  }
  .block h4{
    font-size:0.85rem;
    color:var(--navy);
    margin-bottom:6px;
  }
  .block p{margin:0 0 8px;font-size:0.88rem;}
  .block .submeta{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .block .submeta b{color:var(--ink);}

  .breath-chip{
    margin-top:10px;
    background:#EAF1F4;
    border:1px solid #CFE0E6;
    border-radius:10px;
    padding:10px 12px;
    font-size:0.83rem;
  }
  .breath-chip .name{
    font-weight:600;
    color:var(--teal);
    display:block;
    margin-bottom:3px;
  }

  footer{
    max-width:760px;
    margin:30px auto 0;
    padding:0 16px;
    color:var(--ink-soft);
    font-size:0.78rem;
    text-align:center;
  }

  @media (max-width:480px){
    .thisweek .session-title{font-size:1.1rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Quadern de seguiment setmanal</h1>
    <p>Psicomotricitat · I4 · Curs 2026–2027 · Escola Pia Sitges</p>
  </header>

  <div class="card thisweek" id="thisWeekCard"></div>

  <div class="card">
    <h2>Configuració del calendari</h2>
    <div class="field">
      <label for="startDate">Data de la Sessió 1</label>
      <input type="date" id="startDate">
    </div>

    <div class="field">
      <label>Setmanes saltades (festius, vacances, imprevistos...)</label>
      <div class="row2">
        <div>
          <input type="date" id="skipDate">
        </div>
        <div>
          <input type="text" id="skipReason" placeholder="Motiu (opcional)">
        </div>
      </div>
      <div style="margin-top:8px;">
        <button id="addSkipBtn" type="button">Afegir setmana saltada</button>
      </div>
      <div class="skip-list" id="skipList"></div>
      <div class="reset-row">
        <button type="button" class="secondary" id="resetBtn">Restaurar calendari per defecte</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Llegenda de tipologies</h2>
    <div class="legend">
      <span><i class="dot hmb"></i>Habilitats motrius bàsiques</span>
      <span><i class="dot teatre"></i>Joc teatralitzat</span>
      <span><i class="dot cos"></i>Consciència corporal</span>
      <span><i class="dot esp"></i>Sessió especial</span>
    </div>
  </div>

  <div id="sessionsContainer"></div>

</div>

<footer>Programació d'aula · Psicomotricitat I4 · Escola Pia Sitges · Setembre 2026</footer>

<script>
/* =========================================================
   BANC DE RESPIRACIÓ / IOGA
========================================================= */
const bancRespiracio = {
  "Globus que s'infla": "Inspirem inflant la panxa com un globus, aguantem un instant i deixem anar l'aire lentament fent 'ffff'.",
  "Elefant": "Inspirem aixecant els braços entrellaçats com una trompa i expirem baixant-los lentament.",
  "Serp que xiula": "Inspirem pel nas i expirem llarg fent 'ssss', movent el cos com una serp.",
  "Abella": "Expirem fent 'mmm' amb la boca tancada, notant la vibració.",
  "Postura de l'arbre": "Dempeus, un peu recolzat a l'altra cama, braços amunt: equilibri i concentració.",
  "Gat-vaca": "A quatre grapes, arquegem i corbem l'esquena seguint la respiració.",
  "Papallona": "Asseguts, plantes dels peus juntes, obrim i tanquem les 'ales' (cames) amb calma.",
  "Gos cap avall": "Formem una 'muntanya' amb el cos, mans i peus a terra, respirant profund."

/* =========================================================
   DADES DE LES 30 SESSIONS (extretes de la programació)
========================================================= */
const JJ_1 = "Arribem a l'aula de psico, ens descalcem amb calma —el moment d'arribar tranquils— i fem rotllana per recordar els 3 acords d'aula i les 4 parts de la sessió. El protagonista del dia (o la mestra, si no n'hi ha) tria ";
const JJ_END = ". En acabar, la mestra apaga el llum, senyal per tornar a la rotllana i donar pas al nucli de la sessió.";
function jj(tria){ return JJ_1 + tria + JJ_END; }
const JL_TPL = (material) => `A la nova rotllana, l'adult explica que ara poden jugar lliurement amb el material (${material}). Poden continuar jugant de la manera proposada inicialment o usar la imaginació per fer les seves pròpies propostes. La mestra apaga el llum, senyal per tornar a la rotllana i donar pas a la darrera part.`;
const RR_1 = "Un cop a la rotllana final, ens tornem a posar les sabates. Preguntem als infants quin ha estat el seu moment preferit i donem espai perquè expliquin les seves sensacions. Fem l'exercici de respiració '";
function rr(resp, tancament){ return RR_1 + resp.toLowerCase() + "' (veure banc de recursos). " + tancament; }

const sessions = [
{n:1, t:'esp', ti:"Coneixem l'espai de psico", tr:1, obj:"2.2, 3.2, 4.1", resp:"Globus que s'infla",

  {n:"Presentació de material + joc dirigit", d:"Fem un recorregut guiat pels espais de l'aula de psico: on deixem les sabates, l'aigua i la roba, i on és la 'caseta' del material. Cada infant explora lliurement un racó diferent (bancs, cercles, teles) mentre la mestra hi passa i verbalitza en veu alta el que fa cadascú, per anar-los familiaritzant amb el vocabulari de l'espai.", o:"Gran grup / racons", m:"Bancs, cercles, teles, material divers de l'aula", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("els mateixos racons de l'aula"), o:"Aula de psico · Gran grup", m:"els mateixos racons de l'aula", du:"20 min"},
  {n:"Retroacció i relaxació", d:"Un cop a la rotllana final, ens tornem a posar les sabates. Preguntem als infants quin ha estat el seu moment preferit i donem espai perquè expliquin les seves sensacions. Fem l'exercici de respiració 'el globus que s'infla' (veure banc de recursos). Acabem amb una rotllana de presentació: cadascú diu el seu nom fent un gest amb el cos.", o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:2, t:'hmb', ti:"Circuit d'observació inicial", tr:1, obj:"1.1, 1.2, 1.5", resp:"Elefant",
 b:[
  {n:"Juguem junts", d:jj("el pica-paret (versió plastilina) per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Muntem el primer circuit del curs amb banc, cordes, espatlleres, cercles, cons i piques, dissenyat per observar 3 habilitats motrius bàsiques: salt, equilibri i desplaçament. Hi passen individualment mentre la mestra observa i pren notes per a la graella inicial; després ho repeteixen en parelles, ajudant-se als trams d'equilibri.", o:"Individual i, després, per parelles", m:"Banc, cordes, espatlleres, cercles, cons, piques", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("el mateix material del circuit"), o:"Aula de psico · Gran grup", m:"el mateix material del circuit", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("l'elefant", "Plastilina lliure."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:3, t:'teatre', ti:"Conte 'Escarola Perruqueta'", tr:1, obj:"4.2, 2.5, 4.4", resp:"Abella",
 b:[
  {n:"Juguem junts", d:jj("l'aranya peluda per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"La mestra narra el conte de l'Escarola Perruqueta mentre els infants, per torns, es van guarnint amb mocadors i teles per representar cada personatge. Acompanyem la narració amb moviment i veu: com camina, com parla, com se sent cada personatge en cada moment de la història.", o:"Gran grup", m:"Conte 'Escarola Perruqueta', mocadors, teles", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("els mateixos mocadors i teles"), o:"Aula de psico · Gran grup", m:"els mateixos mocadors i teles", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("l'abella", "Música i massatge per parelles."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},

 b:[
  {n:"Juguem junts", d:jj("l'aranya peluda per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Coincidint amb la setmana de la Castanyada, explicant el conte de la Castanyera ens posem en el lloc dels diferents personatges: la Castanyera que camina ajudant-se d'un bastó, els infants que collen castanyes imaginàries i les couen al foc. A poc a poc som conscients dels moviments, les emocions i els diàlegs de cadascun.", o:"Gran grup", m:"Conte de la Castanyera, mocadors, cistelles", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("els mateixos mocadors i cistelles"), o:"Aula de psico · Gran grup", m:"els mateixos mocadors i cistelles", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("el gos cap avall", "Dibuix."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:5, t:'cos', ti:"El nostre cos: dansa d'en Joan Petit", tr:1, obj:"1.5, 4.1", resp:"Postura de l'arbre",
 b:[
  {n:"Juguem junts", d:jj("el gat i gos per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Aprenem i memoritzem la cançó d'en Joan Petit movent cada part del cos que anomena la lletra, cada cop més ràpid. Un cop coneguda, la fem davant del mirall, parant atenció a quina mà, peu o costat es mou primer, per introduir la primera noció de lateralitat (el costat que 'balla primer').", o:"Gran grup, davant del mirall", m:"Mirall, equip de música", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("l'equip de música"), o:"Aula de psico · Gran grup", m:"l'equip de música", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("la postura de l'arbre", "Plastilina."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:6, t:'teatre', ti:"Colònies: construïm la nostra casa", tr:1, obj:"2.3, 2.5, 4.2", resp:"Serp que xiula",
 b:[
  {n:"Juguem junts", d:jj("el gat i gos per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"En grups cooperatius de 4-5 infants, amb peces de construcció diferents (lego, peces grans, blocs), pensen i acorden com serà la seva 'casa de colònies'. Un cop construïda, hi entren i hi juguen simbòlicament: qui hi dorm, qui hi cuina, qui en fa de guia. La mestra circula pels grups fent de testimoni, sense dirigir el contingut del joc.", o:"Grups cooperatius de 4-5", m:"Peces de construcció (lego, peces grans, blocs)", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("les mateixes peces de construcció"), o:"Aula de psico · Gran grup", m:"les mateixes peces de construcció", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("la serp que xiula", "Dibuix individual de la casa que han construït."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:7, t:'cos', ti:"Figures d'acrosport", tr:1, obj:"2.5, 4.4", resp:"Papallona",
 b:[
  {n:"Juguem junts", d:jj("un dels 3 jocs de l'any (pica-paret versió plastilina, aranya peluda o gat i gos), triat lliurement per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Mirem imatges d'escultures humanes (Innovamat, número 4) i n'observem la forma. En grups de 4 (cooperatiu), busquen les imatges on hi apareixen 4 infants i intenten reproduir-les amb el propi cos, ajustant equilibris i suports mutus.", o:"Grups de 4", m:"Imatges d'acrosport (Innovamat), equip de música", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("l'equip de música"), o:"Aula de psico · Gran grup", m:"l'equip de música", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("la papallona", "Música i massatge."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:8, t:'cos', ti:"Grafismes amb el cos", tr:1, obj:"5.1, 5.2 (relació amb Innovamat/tutors)", resp:"Elefant",
 b:[
  {n:"Juguem junts", d:jj("un dels 3 jocs de l'any (pica-paret versió plastilina, aranya peluda o gat i gos), triat lliurement per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Observem imatges reals amb grafismes repetits (ratlles, espirals, ones) i, entre tots, els identifiquem i els dibuixem amb guix al terra a mida gran. Després els resseguim caminant-hi a sobre amb els peus i, finalment, amb un dit a l'aire, treballant l'orientació espacial i la pinça digital de manera integrada.", o:"Gran grup / individual", m:"Imatges de grafismes, guixos", du:"40 min"},
  {n:"Joc lliure", d:JL_TPL("els guixos i les imatges de grafismes"), o:"Aula de psico · Gran grup", m:"els guixos i les imatges de grafismes", du:"20 min"},
  {n:"Retroacció i relaxació", d:rr("l'elefant", "Plastilina."), o:"Aula de psico · Gran grup", m:"Equip de música", du:"15 min"}
 ]},
{n:9, t:'teatre', ti:"Assaig funció de Nadal", tr:1, obj:"4.1, 4.2", resp:"La bombolla",
 b:[
  {n:"Juguem junts", d:jj("un dels 3 jocs de l'any (pica-paret versió plastilina, aranya peluda o gat i gos), triat lliurement per jugar-hi uns minuts"), o:"Aula de psico · Gran grup", m:"Cap material específic", du:"15 min"},
  {n:"Presentació de material + joc dirigit", d:"Sessió reservada per assajar la funció de Nadal: repassem entrades, sortides i moviments de cada personatge sobre l'escenari, en un ambient de joc i sense pressió.", o:"Gran grup", m:"Vestuari i atrezzo de la funció", du:"40 min"},

  {n:"Presentació de material + joc dirigit", d:"Joc lliure ampli amb tot el material de l'aula de psico, sense proposta guiada, per tancar el curs amb llibertat total d'elecció.", o:"Gran grup", m:"Equip de música, material divers", du:"40 min"},

 ]}
];

const tipolLabel = {hmb:"Habilitats motrius bàsiques", teatre:"Joc teatralitzat", cos:"Consciència corporal", esp:"Especial"};
const trimestreLabel = {1:"1r trimestre", 2:"2n trimestre", 3:"3r trimestre"};

/* =========================================================
   PERSISTÈNCIA (localStorage)
========================================================= */
const LS_START = "psico_i4_start_date";
const LS_SKIPS = "psico_i4_skip_weeks";
const LS_INIT = "psico_i4_initialized";

// Calendari oficial 2026-27: la Sessió 1 és el dijous 8 d'octubre de 2026.
// Marges trimestrals i vacances escolars ja incorporats com a "setmanes saltades" per defecte.
const DEFAULT_START = "2026-10-08";
const DEFAULT_SKIPS = [
  {date:"2026-12-17", reason:"Marge trimestre 1 (imprevistos)"},
  {date:"2026-12-24", reason:"Vacances de Nadal"},
  {date:"2026-12-31", reason:"Vacances de Nadal"},
  {date:"2027-01-07", reason:"Vacances de Nadal"},
  {date:"2027-03-18", reason:"Marge trimestre 2 (imprevistos)"},
  {date:"2027-03-25", reason:"Setmana Santa"},
  {date:"2027-06-17", reason:"Marge trimestre 3 (imprevistos)"}
];

function loadStart(){
  return localStorage.getItem(LS_START) || DEFAULT_START;
}
function saveStart(v){ localStorage.setItem(LS_START, v); }

function loadSkips(){
  const alreadyInit = localStorage.getItem(LS_INIT);
  if(!alreadyInit){
    localStorage.setItem(LS_SKIPS, JSON.stringify(DEFAULT_SKIPS));
    localStorage.setItem(LS_INIT, "1");
    return [...DEFAULT_SKIPS];
  }
  try{
    const raw = localStorage.getItem(LS_SKIPS);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveSkips(list){ localStorage.setItem(LS_SKIPS, JSON.stringify(list)); }

/* =========================================================
   CÀLCUL DE CALENDARI
========================================================= */
function parseISO(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}
function daysBetween(d1,d2){
  const MS = 24*60*60*1000;
  return Math.round((strip(d2)-strip(d1))/MS);
}
function strip(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function weekOffsetOfSkip(skipDateStr, startDate){
  return Math.round(daysBetween(startDate, parseISO(skipDateStr))/7);
}

function buildSchedule(startDate, skips, totalSessions){
  const schedule = [];
  let sessionNum = 1;
  let weekOffset = 0;
  const skipOffsets = new Set(skips.map(s => weekOffsetOfSkip(s.date, startDate)));
  const skipReasonByOffset = {};
  skips.forEach(s=>{ skipReasonByOffset[weekOffsetOfSkip(s.date,startDate)] = s.reason; });

  while(sessionNum <= totalSessions && weekOffset < 300){
    const date = addDays(startDate, weekOffset*7);
    if(skipOffsets.has(weekOffset)){
      schedule.push({weekOffset, date, skipped:true, reason: skipReasonByOffset[weekOffset] || ""});
    } else {
      schedule.push({weekOffset, date, skipped:false, sessionNum});
      sessionNum++;
    }
    weekOffset++;
  }
  return schedule;
}

const CAT_MONTHS = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const CAT_DAYS = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
function formatDateLong(date){
  return CAT_DAYS[date.getDay()] + " " + date.getDate() + " de " + CAT_MONTHS[date.getMonth()] + " de " + date.getFullYear();
}
function formatDateShort(date){
  return date.getDate() + " " + CAT_MONTHS[date.getMonth()].slice(0,3) + ". " + date.getFullYear();
}

/* =========================================================
   RENDER
========================================================= */
let state = {
  start: loadStart(),
  skips: loadSkips()
};

function render(){
  const startDate = strip(parseISO(state.start));
  const today = strip(new Date());
  const schedule = buildSchedule(startDate, state.skips, sessions.length);

  const byNum = {};
  schedule.forEach(e => { if(!e.skipped) byNum[e.sessionNum] = e; });

  let todayOffset = null;
  if(daysBetween(startDate, today) >= 0){
    todayOffset = Math.floor(daysBetween(startDate, today)/7);
  }

  renderThisWeek(schedule, byNum, startDate, today, todayOffset);
  renderConfig();
  renderSessions(byNum, todayOffset);
}

function renderThisWeek(schedule, byNum, startDate, today, todayOffset){
  const el = document.getElementById('thisWeekCard');

  if(todayOffset === null){
    const days = daysBetween(today, startDate);
    el.innerHTML = `
      <div class="eyebrow">Encara no ha començat</div>
      <div class="session-title">El curs de psicomotricitat comença el ${formatDateLong(startDate)}</div>
      <div class="status-msg">Falten ${days} dia${days===1?'':'s'} perquè comenci la Sessió 1.</div>
    `;
    return;
  }

  const totalWeeks = schedule.length;
  if(todayOffset >= totalWeeks){
    el.innerHTML = `
      <div class="eyebrow">Curs acabat</div>
      <div class="session-title">Ja s'han fet totes les sessions! 🎉</div>
      <div class="status-msg">Les 30 sessions de la programació d'aquest curs s'han completat.</div>
    `;
    return;
  }

  const entry = schedule[todayOffset];
  if(entry.skipped){
    const next = schedule.find(e => e.weekOffset > todayOffset && !e.skipped);
    const reasonTxt = entry.reason ? ` (${entry.reason})` : "";
    if(next){
      const s = sessions.find(x => x.n === next.sessionNum);
      const days = daysBetween(today, next.date);
      const weeks = Math.ceil(days/7);
      el.innerHTML = `
        <div class="eyebrow">Aquesta setmana no toca sessió${reasonTxt}</div>
        <div class="session-title">Propera: Sessió ${s.n} · ${s.ti}</div>
        <div class="meta-row">
          <span class="badge ${s.t}">${tipolLabel[s.t]}</span>
        </div>
        <div class="status-msg">El ${formatDateLong(next.date)} — d'aquí a ${days} dia${days===1?'':'s'} (~${weeks} setman${weeks===1?'a':'es'}).</div>
      `;
    } else {
      el.innerHTML = `
        <div class="eyebrow">Setmana saltada${reasonTxt}</div>
        <div class="session-title">No hi ha sessió aquesta setmana</div>
      `;
    }
    return;
  }

  const s = sessions.find(x => x.n === entry.sessionNum);
  el.innerHTML = `
    <div class="eyebrow">Aquesta setmana · Sessió ${s.n} de 30</div>
    <div class="session-title">${s.ti}</div>
    <div class="meta-row">
      <span class="badge ${s.t}">${tipolLabel[s.t]}</span>
      <span class="status-msg">${formatDateLong(entry.date)}</span>
    </div>
  `;
}

function renderConfig(){
  const startInput = document.getElementById('startDate');
  if(document.activeElement !== startInput){
    startInput.value = state.start;
  }

  const list = document.getElementById('skipList');
  if(state.skips.length === 0){
    list.innerHTML = `<p class="empty-note">Cap setmana saltada encara.</p>`;
    return;
  }
  const sorted = [...state.skips].sort((a,b)=> a.date.localeCompare(b.date));
  list.innerHTML = sorted.map(sk => `
    <div class="skip-item">
      <div class="txt">${formatDateShort(parseISO(sk.date))}${sk.reason ? `<small>${escapeHtml(sk.reason)}</small>` : ''}</div>
      <button type="button" data-skipdate="${sk.date}" class="removeSkip">✕</button>
    </div>
  `).join('');

  list.querySelectorAll('.removeSkip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.getAttribute('data-skipdate');
      state.skips = state.skips.filter(s => s.date !== d);
      saveSkips(state.skips);
      render();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderSessions(byNum, todayOffset){
  const container = document.getElementById('sessionsContainer');
  const openIds = new Set(
    [...container.querySelectorAll('.session-item.open')].map(el => el.getAttribute('data-num'))
  );

  const trimestres = [1,2,3];
  let html = '';

  trimestres.forEach(tr=>{
    html += `<h2 class="trimestre-title">${trimestreLabel[tr]}</h2>`;
    sessions.filter(s => s.tr === tr).forEach(s=>{
      const entry = byNum[s.n];
      let status = 'upcoming';
      if(entry){
        if(todayOffset !== null){
          if(entry.weekOffset < todayOffset) status = 'passed';
          else if(entry.weekOffset === todayOffset) status = 'current';
        }
      }
      const dateTxt = entry ? formatDateShort(entry.date) : '—';
      const isOpen = openIds.has(String(s.n));

      html += `
        <div class="session-item ${status} ${isOpen?'open':''}" data-num="${s.n}">
          <div class="session-head" data-toggle="${s.n}">
            <span class="session-num">#${s.n}</span>
            <span class="badge ${s.t}">${tipolLabel[s.t]}</span>
            <div class="titles">
              <h3>${s.ti}</h3>
              <div class="date">${dateTxt}</div>
            </div>
            <span class="chevron">›</span>
          </div>
          <div class="session-body">
            ${renderSessionDetail(s)}
          </div>
        </div>
      `;
    });
  });

  container.innerHTML = html;

  container.querySelectorAll('[data-toggle]').forEach(head=>{
    head.addEventListener('click', ()=>{
      const item = head.closest('.session-item');
      item.classList.toggle('open');
    });
  });
}

function renderSessionDetail(s){
  const objLine = s.obj && s.obj !== "—" ? `<div class="obj-line">Objectius treballats: ${s.obj}</div>` : '';

  const blocksHtml = s.b.map((bl,i)=>{
    let breathChip = '';
    if(i === s.b.length-1 && s.resp){
      const desc = bancRespiracio[s.resp];
      breathChip = `
        <div class="breath-chip">
          <span class="name">🌬️ Exercici de respiració: ${s.resp}</span>
          ${desc ? desc : `<em>No descrit al banc de recursos del document.</em>`}
        </div>
      `;
    }
    return `
      <div class="block">
        <h4>${i+1}. ${bl.n}</h4>
        <p>${bl.d}</p>
        <div class="submeta">
          <span><b>Organització/espai:</b> ${bl.o}</span>
          <span><b>Materials:</b> ${bl.m}</span>
          <span><b>Durada:</b> ${bl.du}</span>
        </div>
        ${breathChip}
      </div>
    `;
  }).join('');

  return `${objLine}${blocksHtml}`;
}

/* =========================================================
   EVENTS
========================================================= */
document.getElementById('startDate').addEventListener('change', (e)=>{
  if(e.target.value){
    state.start = e.target.value;
    saveStart(state.start);
    render();
  }
});

document.getElementById('addSkipBtn').addEventListener('click', ()=>{
  const dateInput = document.getElementById('skipDate');
  const reasonInput = document.getElementById('skipReason');
  if(!dateInput.value) return;
  const exists = state.skips.some(s => s.date === dateInput.value);
  if(!exists){
    state.skips.push({date: dateInput.value, reason: reasonInput.value.trim()});
    saveSkips(state.skips);
  }
  dateInput.value = '';
  reasonInput.value = '';
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm("Vols restaurar la data d'inici i les setmanes saltades als valors per defecte del document?")){
    state.start = DEFAULT_START;
    state.skips = [...DEFAULT_SKIPS];
    saveStart(state.start);
    saveSkips(state.skips);
    render();
  }
});

render();
</script>
